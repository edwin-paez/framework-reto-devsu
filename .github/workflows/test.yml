name: Ejecutar pruebas automatizadas

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente'
        required: true
        type: choice
        options:
          - default
          - stg
          - dev
          - prod
        default: 'default'
      tags:
        description: 'Tags de Cucumber (ej: @Smoke, @Buys)'
        required: false
        type: string
        default: '@Smoke'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Run tests
      run: |
        echo "Ambiente seleccionado: ${{ github.event.inputs.environment }}"
        echo "Tags: ${{ github.event.inputs.tags }}"
        if [ -n "${{ github.event.inputs.tags }}" ]; then
          ./gradlew clean test -Denvironment=${{ github.event.inputs.environment }} -Dcucumber.filter.tags="${{ github.event.inputs.tags }}"
        else
          ./gradlew clean test -Denvironment=${{ github.event.inputs.environment }}
        fi
    
    - name: Upload Serenity Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serenity-report-${{ github.event.inputs.environment }}
        path: target/site/serenity/
    
    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site/serenity
        destination_dir: reports/${{ github.run_number }}