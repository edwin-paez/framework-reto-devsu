serenity.project.name = "framework-reto-devsu"
serenity.take.screenshots = FOR_EACH_ACTION
serenity.step.delay = 0
serenity.report.encoding = "UTF-8"

webdriver.driver = chrome
webdriver.timeouts.implicitlywait = 10000
webdriver.wait.for.timeout = 10000
headless.mode = true

chrome.switches = [
  "--start-maximized",
  "--no-sandbox",
  "--disable-dev-shm-usage",
  "--incognito"
]

environments {
	default {
		webdriver.base.url = "https://www.saucedemo.com/"
	}

	stg {
		webdriver.base.url = "https://www.saucedemo.com/"
	}

	dev {
		webdriver.base.url = "https://www.saucedemo.com/dev/"
	}

	prod {
		webdriver.base.url = "https://www.saucedemo.com/prod/"
	}
}