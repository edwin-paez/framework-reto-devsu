plugins {
    id 'java'
    id 'idea'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.34'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.devsu.reto'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    serenityVersion = '4.2.34'
    cucumberVersion = '7.20.1'
    karateVersion = '1.5.1'
    lombokVersion = '1.18.38'
    assertjVersion = '3.27.3'
}

dependencies {

    // Serenity Core
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-junit5:${serenityVersion}"

    // Screenplay
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"

    // Cucumber
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"

    // Selenium
    testImplementation "org.seleniumhq.selenium:selenium-java:4.33.0"

    // Assertions
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.hamcrest:hamcrest:3.0"

    // Faker
    testImplementation "net.datafaker:datafaker:2.4.2"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // JUnit 5
    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-suite:1.12.2"

    testImplementation "org.apache.commons:commons-lang3:3.14.0"
    testImplementation "org.apache.poi:poi-ooxml:5.3.0"
}

tasks.named('test') {
    useJUnitPlatform()

    systemProperty "environment", System.getProperty("environment", "default")
    def selectedTags =
            System.getProperty(
                    "tags", System.getProperty("cucumber.filter.tags", "@Smoke"))
    systemProperty "cucumber.filter.tags", selectedTags

    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
    }

    finalizedBy aggregate
}

serenity {
    reports = ["single-page-html"]
}

spotless {
    java {
        googleJavaFormat('1.25.2').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}